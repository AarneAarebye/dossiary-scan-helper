name: Feature request
description: Suggest or track a new feature or an improvement
labels: ["enhancement", "needs-spec"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which app is this about?
      options:
        - Dossiary page (dossiary.html)
        - Dossiary for Mac
        - Dossiary for iPhone and iPad
        - Dossiary Sync (Mac service, Pi hub)
        - Dossiary Scan Helper (Mac)
        - Several of them
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The situation or problem first, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How could it work? Optional.
  - type: dropdown
    id: hub
    attributes:
      label: Does it involve synced libraries (the Pi hub)?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, other apps that do it well, links.
