<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="Dossiary sends POST /scan to the helper on localhost; the helper, which lists the Pi's scanner as remote:&lt;server&gt;:&lt;id&gt;, forwards it over HTTPS on port 8767 with a pinned certificate to scanix500-server on a Raspberry Pi, which drives the iX500 over USB. The PDF and its ocrJob come back the same way. Dossiary then polls GET /ocr/remote.&lt;server&gt;.&lt;job&gt; at the helper, which forwards GET /ocr/&lt;job&gt; to the server.">
<style>
  .bg{fill:#f6f7f4} .surface{fill:#ffffff} .ink{fill:#1d2421} .muted{fill:#5d6a64} .acc{fill:#157a55} .soft{fill:#d5ebe0}
  .s-ink{stroke:#1d2421} .s-line{stroke:#c9d1cc} .s-acc{stroke:#157a55}
  text{font-family:"Helvetica Neue",Arial,sans-serif} .mono{font-family:Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#131917} .surface{fill:#1b2320} .ink{fill:#e3ebe6} .muted{fill:#98a7a0} .acc{fill:#4fe0a6} .soft{fill:#1f3a30}
    .s-ink{stroke:#e3ebe6} .s-line{stroke:#34413c} .s-acc{stroke:#4fe0a6}
  }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
  <marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
</defs>
<rect width="960" height="280" rx="10" class="bg"/>
<rect x="10" y="20" width="440" height="245" rx="10" fill="none" stroke-dasharray="5 5" class="s-line"/>
<text x="22" y="40" font-size="12" class="muted mono">THE USER'S COMPUTER</text>
<rect x="520" y="20" width="430" height="245" rx="10" fill="none" stroke-dasharray="5 5" class="s-line"/>
<text x="532" y="40" font-size="12" class="muted mono">RASPBERRY PI</text>

<rect x="30" y="80" width="160" height="80" rx="8" class="surface s-ink"/>
<text x="110" y="113" text-anchor="middle" font-size="15" font-weight="700" class="ink">Dossiary</text>
<text x="110" y="135" text-anchor="middle" font-size="12" class="muted">in the browser</text>

<rect x="260" y="80" width="170" height="80" rx="8" class="surface s-ink"/>
<text x="345" y="108" text-anchor="middle" font-size="15" font-weight="700" class="ink">Scan helper</text>
<text x="345" y="127" text-anchor="middle" font-size="12" class="muted">relays to the server</text>
<text x="345" y="145" text-anchor="middle" font-size="10" class="muted mono">remote:&lt;server&gt;:&lt;id&gt;</text>

<rect x="540" y="80" width="220" height="80" rx="8" stroke-width="1.5" class="soft s-acc"/>
<text x="650" y="108" text-anchor="middle" font-size="15" font-weight="700" class="ink">scanix500-server</text>
<text x="650" y="128" text-anchor="middle" font-size="12" class="muted">capture · blank pages · PDF</text>
<text x="650" y="146" text-anchor="middle" font-size="12" class="muted">OCR jobs</text>

<rect x="830" y="80" width="100" height="80" rx="8" class="surface s-ink"/>
<text x="880" y="113" text-anchor="middle" font-size="15" font-weight="700" class="ink">iX500</text>
<text x="880" y="135" text-anchor="middle" font-size="12" class="muted">ScanSnap</text>

<text x="224" y="97" text-anchor="middle" font-size="10" class="ink mono">POST /scan</text>
<line x1="192" y1="105" x2="256" y2="105" stroke-width="1.5" class="s-ink" marker-end="url(#arr)"/>
<line x1="256" y1="140" x2="192" y2="140" stroke-width="1.5" class="s-ink" marker-end="url(#arr)"/>
<text x="224" y="157" text-anchor="middle" font-size="10" class="ink mono">PDF · ocrJob</text>
<text x="224" y="180" text-anchor="middle" font-size="11" class="muted">localhost only</text>

<text x="484" y="72" text-anchor="middle" font-size="10" class="acc mono">HTTPS :8767</text>
<text x="484" y="97" text-anchor="middle" font-size="10" class="acc mono">POST /scan</text>
<line x1="432" y1="105" x2="536" y2="105" stroke-width="2.5" class="s-acc" marker-end="url(#arra)"/>
<line x1="536" y1="140" x2="432" y2="140" stroke-width="2.5" class="s-acc" marker-end="url(#arra)"/>
<text x="484" y="157" text-anchor="middle" font-size="10" class="acc mono">PDF · ocrJob</text>
<text x="484" y="180" text-anchor="middle" font-size="11" class="muted">pinned certificate</text>

<line x1="762" y1="120" x2="826" y2="120" stroke-width="1.5" class="s-ink" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="794" y="112" text-anchor="middle" font-size="10" class="ink mono">USB · SANE</text>

<path d="M 110 162 C 110 235, 320 235, 320 164" fill="none" stroke-width="1.2" stroke-dasharray="4 4" class="s-ink" marker-end="url(#arr)"/>
<text x="215" y="252" text-anchor="middle" font-size="10" class="ink mono">GET /ocr/remote.&lt;server&gt;.&lt;job&gt;</text>
<path d="M 370 162 C 370 235, 650 235, 650 164" fill="none" stroke-width="1.2" stroke-dasharray="4 4" class="s-acc" marker-end="url(#arra)"/>
<text x="510" y="252" text-anchor="middle" font-size="10" class="acc mono">GET /ocr/&lt;job&gt;</text>
</svg>
